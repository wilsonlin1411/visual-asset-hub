# Search acceptance cases (docs/SPEC.md section 6). `photos` are file names in tests/images,
# matched to the library by the name each photo was imported under. Build the demo library first:
#   python -m backend.cli.library ingest tests/images
#   python tools/seed_library.py
# A query passes when one of its top-5 hits comes from one of `photos` (and, if `categories`
# is given, carries one of those categories). Target: >= 80% of queries pass (hit@5).

[[case]]
query = "辦公桌上的電腦周邊"
photos = ["PXL_20260617_055925417.jpg", "PXL_20260829_193653800.jpg"]
categories = ["滑鼠", "鍵盤", "滑鼠墊"]

