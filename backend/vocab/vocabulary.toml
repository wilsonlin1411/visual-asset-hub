# Visual Asset Hub tag vocabulary (mirrors docs/SPEC.md section 3 - keep both in sync).
# After editing: python -m backend.cli.library retag
#
# prompts   English phrases inserted into the CLIP templates below (several per entry are averaged)
# synonyms  Chinese terms matched in search queries (the entry name itself always matches)
# coco      YOLO (COCO) labels that map to this category

version = 1

[templates]
category = ["a photo of {}.", "a product photo of {}.", "a close-up photo of {}."]
material = ["a photo of an object made of {}.", "a close-up photo of {} texture."]
style = ["a {} object.", "a photo of a {} item."]
context = ["a photo of {}.", "a scene of {}."]

[scene]
# Whole-photo context matching competes against these generic prompts; when they win,
# no scene context is added (softmax would otherwise force the least-bad context).
none = ["a photo of an object.", "a product photo.", "a close-up photo.", "a photo of a thing on a table."]

[objectness]
# CLIP sees the candidate region with everything outside its mask painted gray.
# 0.40 chosen from tools/objectness_report.py on the 25 test photos (hides ~31% of unlabeled
# candidates; 0.25-0.45 is mixed, hidden ones stay available via include_hidden).
threshold = 0.40
object = [
  "a photo of a single object on a gray background.",
  "a product photo of an item.",
  "a close-up photo of a thing.",
  "a photo of a toy.",
  "a photo of food.",
]
background = [
  "a photo of a table surface.",
  "a photo of a floor.",
  "a photo of a wall.",
  "a photo of a tablecloth.",
  "a blurry background.",
  "a small fragment of something.",
  "printed text on a sheet of paper.",
  "an empty gray image.",
]

[tagging]
# Softmax temperature applied to cosine similarities (CLIP's logit scale).
logit_scale = 100.0
# Use the YOLO label when its score >= this and its mapped category is in CLIP's top-k.
yolo_trust_score = 0.5
yolo_trust_topk = 3
# ...and CLIP gives that category at least this probability. Without it a very confident
# CLIP answer can be overridden (Stanley tumbler: CLIP 隨行杯 0.99, YOLO "cup" -> 咖啡杯 0.004).
yolo_min_prob = 0.10
# CLIP top-1 category below this probability becomes "其他".
category_min_prob = 0.15
# Materials / styles: keep labels with probability >= this (max 2).
attribute_min_prob = 0.30
# Whole-photo scene contexts: keep labels with probability >= this (max 2).
scene_min_prob = 0.35
# Candidate categories used by the co-occurrence rules need at least this probability
# (or a YOLO label that CLIP agrees with). Confirmed assets always count. Lower values let
# misread fragments invent contexts (a round head read as a helmet at 0.65 -> 通勤).
rule_min_prob = 0.70
# Colours covering at least this fraction of the opaque pixels (max 2).
color_min_ratio = 0.25

