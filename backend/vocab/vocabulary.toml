prompts = ["a meal at a restaurant"]
synonyms = ["吃飯", "晚餐", "午餐", "餐廳"]

[[context]]
name = "甜點時光"
prompts = ["afternoon tea with desserts"]
synonyms = ["下午茶"]

[[context]]
name = "小酌"
prompts = ["drinks at a bar"]
synonyms = ["喝酒", "下班", "微醺", "酒吧"]

[[context]]
name = "居家"
prompts = ["at home"]
synonyms = ["家裡", "房間"]

[[context]]
name = "戶外"
prompts = ["outdoors"]
synonyms = ["街上"]

[[context]]
name = "通勤"
prompts = ["commuting by scooter"]
synonyms = ["騎車", "機車", "上班路上"]

[[context]]
name = "購物"
prompts = ["a retail store display"]
synonyms = ["逛街", "商店", "展示櫃"]

[[context]]
name = "開箱"
prompts = ["unboxing a new product"]
synonyms = ["新品", "拆箱"]
# CLIP reads almost any product shot as "unboxing" (0.9+ on a toy, a phone case):
# only the 包裝盒 + product rule may assign it.
scene = false

[[context]]
name = "收藏"
prompts = ["collectible toys on display"]
synonyms = ["收藏品", "公仔展示"]

[[context]]
name = "保健"
prompts = ["taking medicine"]
synonyms = ["生病", "感冒", "健康"]

[[context]]
name = "旅行"
prompts = ["sightseeing at a museum or landmark"]
synonyms = ["博物館", "展覽", "景點", "出遊"]

# -------------------------------------------------------------------------------- rules
# A rule fires when the photo contains every category in `all` and at least `min_any`
# (default 1) of the categories in `any`.

[[rule]]
all = ["筆電", "咖啡杯"]
contexts = ["遠距工作", "咖啡廳"]

[[rule]]
all = ["筆電", "滑鼠"]
contexts = ["遠距工作"]

[[rule]]
all = ["咖啡杯"]
any = ["甜點", "麵包"]
contexts = ["咖啡廳", "甜點時光"]

[[rule]]
any = ["滑鼠", "鍵盤", "螢幕", "滑鼠墊"]
min_any = 2
contexts = ["辦公桌面"]

[[rule]]
all = ["甜點"]
contexts = ["甜點時光"]

[[rule]]
any = ["肉類主餐", "披薩", "飯類"]
contexts = ["用餐"]

[[rule]]
all = ["餐具"]
any = ["盤子", "碗"]
contexts = ["用餐"]

[[rule]]
any = ["酒瓶", "罐裝飲料"]
contexts = ["小酌"]

[[rule]]
all = ["包裝盒"]
any = ["滑鼠", "手機", "耳機", "隨行杯", "公仔"]
contexts = ["開箱"]

[[rule]]
all = ["公仔"]
contexts = ["收藏"]

[[rule]]
all = ["安全帽"]
contexts = ["通勤"]

[[rule]]
all = ["藥品"]
contexts = ["保健"]

[[rule]]
all = ["雕像"]
contexts = ["旅行"]

[[rule]]
all = ["寵物"]
contexts = ["居家"]

[[rule]]
all = ["野生動物"]
contexts = ["戶外", "旅行"]
